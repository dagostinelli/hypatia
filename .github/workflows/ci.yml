name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # platforms and compilers (cc unset: the platform's default compiler)
          - { name: ubuntu / gcc,             os: ubuntu-latest,  cc: gcc,      quad: _Float128 }
          - { name: ubuntu / clang,           os: ubuntu-latest,  cc: clang,    quad: __float128 }
          - { name: ubuntu-22.04 / gcc-9,     os: ubuntu-22.04,   cc: gcc-9,    install: gcc-9 }
          - { name: ubuntu-22.04 / clang-12,  os: ubuntu-22.04,   cc: clang-12, install: clang-12 }
          - { name: ubuntu-24.04 / gcc-14,    os: ubuntu-24.04,   cc: gcc-14,   install: gcc-14 }
          - { name: macos / default,          os: macos-latest }
          - { name: windows / msvc,           os: windows-latest }
          - { name: windows / mingw gcc,      os: windows-latest, cc: gcc,      generator: MinGW Makefiles, quad: __float128 }
          - { name: ubuntu arm64 / gcc,       os: ubuntu-24.04-arm, cc: gcc,    quad: _Float128 }
          - { name: ubuntu arm64 / clang,     os: ubuntu-24.04-arm, cc: clang,  quad: long double }
          - { name: ubuntu / gcc 32-bit,      os: ubuntu-latest,  cc: gcc,      install: gcc-multilib, cflags: -m32, ldflags: -m32 }

          # optimized builds
          - { name: ubuntu / gcc Release,     os: ubuntu-latest,  cc: gcc,      build_type: Release }
          - { name: ubuntu / clang Release,   os: ubuntu-latest,  cc: clang,    build_type: Release }
          - { name: macos / default Release,  os: macos-latest,                 build_type: Release }
          - { name: windows / msvc Release,   os: windows-latest,               build_type: Release }
          - { name: windows / msvc nmake,     os: windows-latest,               build_type: Release, generator: NMake Makefiles, vcvars: true }

          # variants
          - { name: sanitizers / gcc,         os: ubuntu-latest,  cc: gcc,
              cflags: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer",
              ldflags: "-fsanitize=address,undefined" }
          - { name: sanitizers / clang,       os: ubuntu-latest,  cc: clang,
              cflags: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer",
              ldflags: "-fsanitize=address,undefined" }
          - { name: no-stdio / gcc,           os: ubuntu-latest,  cc: gcc,      cflags: -DHYP_NO_STDIO }
          - { name: no-stdio / clang,         os: ubuntu-latest,  cc: clang,    cflags: -DHYP_NO_STDIO }
    env:
      BUILD_TYPE: ${{ matrix.build_type || 'Debug' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        if: matrix.install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}
      - name: Set up the MSVC command-line environment
        if: matrix.vcvars
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set >> %GITHUB_ENV%
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC="${{ matrix.cc }}"; fi
          args=(-B build -DHYPATIA_BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
                -DCMAKE_C_FLAGS="${{ matrix.cflags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.ldflags }}")
          if [ -n "${{ matrix.generator }}" ]; then args+=(-G "${{ matrix.generator }}"); fi
          cmake "${args[@]}"
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}
      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # where a 128-bit type is expected, the quad tests must have been built
      - name: Check that quad precision ran (${{ matrix.quad }})
        if: matrix.quad
        shell: bash
        run: ctest --test-dir build -N | grep -q _quad_precision

  # the measured errors and instruction counts must not be worse than
  # test/precision/baseline_*.txt and test/speed/baseline_*.txt; the baselines
  # were made with this image's gcc and glibc
  precision:
    name: precision and speed gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure
        run: CC=gcc cmake -B build -DHYPATIA_BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=Release -DHYPATIA_PRECISION_CHECK=ON -DHYPATIA_SPEED_CHECK=ON
      - name: Build
        run: cmake --build build --target precision_single precision_double speed_single speed_double
      - name: Check precision
        run: ctest --test-dir build -R precision_check --output-on-failure
      - name: Check speed
        run: ctest --test-dir build -R speed_check --output-on-failure

  readme-example:
    name: readme example / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc }
          - { os: ubuntu-latest,  cc: clang }
          - { os: macos-latest,   cc: cc }
          - { os: windows-latest, cc: cl }
    steps:
      - uses: actions/checkout@v5
      - name: Extract the Basic Usage example
        shell: bash
        run: awk '/^Basic Usage/{s=1} s&&/^```/{if(f){exit} f=1; next} f' README.md > example.c
      - name: Build and run (gcc, clang, cc)
        if: matrix.cc != 'cl'
        run: |
          ${{ matrix.cc }} -std=c90 -Wall -Wextra -Werror example.c -o example -lm
          ./example
      - name: Build and run (cl)
        if: matrix.cc == 'cl'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W3 /WX example.c
          example.exe

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build the docs (warnings are errors)
        run: |
          cmake -B build -DHYPATIA_BUILD_TESTS=OFF
          cmake --build build --target hypatia_docs

  package:
    name: cmake package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install, then use with find_package
        shell: bash
        run: |
          cmake -S . -B build -DHYPATIA_BUILD_TESTS=OFF -DHYPATIA_BUILD_DOCS=OFF
          cmake --install build --prefix "$PWD/prefix" --config Release
          cmake -S test/package -B consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer --config Release
          ctest --test-dir consumer -C Release --output-on-failure
      - name: Use with add_subdirectory
        shell: bash
        run: |
          cmake -S test/package -B subdirectory -DHYPATIA_SOURCE_DIR="$PWD"
          cmake --build subdirectory --config Release
          ctest --test-dir subdirectory -C Release --output-on-failure
